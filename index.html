<title>My Space</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f7f7f5;
    color:#262626;
}
button,input,textarea{font:inherit}
button{cursor:pointer}

.app{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:245px;
    background:#fff;
    border-right:1px solid #e8e8e5;
    padding:22px 14px;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
}

.logo{
    font-size:21px;
    font-weight:700;
    padding:8px 10px 25px;
    letter-spacing:-.5px;
}

.nav-title{
    font-size:11px;
    color:#999;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:12px 10px 7px;
}

.nav-item{
    width:100%;
    border:0;
    background:transparent;
    text-align:left;
    padding:9px 10px;
    border-radius:7px;
    margin-bottom:2px;
    color:#444;
}

.nav-item:hover,
.nav-item.active{
    background:#f0f0ed;
}

.add-list{
    margin-top:12px;
    color:#777;
}

/* CONTENT */
.content{
    margin-left:245px;
    width:calc(100% - 245px);
    min-height:100vh;
    padding:45px 55px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.page-title{
    font-size:34px;
    font-weight:700;
    letter-spacing:-1px;
}

.subtitle{
    color:#999;
    margin-top:5px;
}

.top-actions{
    display:flex;
    gap:8px;
}

.btn{
    border:1px solid #ddd;
    background:white;
    padding:9px 15px;
    border-radius:7px;
    color:#444;
}

.btn:hover{background:#f4f4f2}

.btn.primary{
    background:#222;
    color:white;
    border-color:#222;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:14px;
}

.card{
    background:white;
    border:1px solid #e7e7e3;
    border-radius:12px;
    padding:22px;
    min-height:120px;
    transition:.15s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.card-icon{
    font-size:25px;
    margin-bottom:18px;
}

.card-name{
    font-weight:600;
    font-size:16px;
}

.card-count{
    color:#999;
    font-size:13px;
    margin-top:7px;
}

/* TABLE */
.back{
    border:0;
    background:transparent;
    padding:0;
    color:#777;
    margin-bottom:18px;
}

.table-wrap{
    background:white;
    border:1px solid #e5e5e1;
    border-radius:10px;
    overflow:auto;
}

table{
    border-collapse:collapse;
    width:100%;
    min-width:750px;
}

th{
    text-align:left;
    background:#fafaf8;
    color:#888;
    font-size:12px;
    font-weight:500;
    padding:12px 14px;
    border-bottom:1px solid #e5e5e1;
}

td{
    padding:4px 8px;
    border-bottom:1px solid #eee;
}

td input{
    border:0;
    outline:0;
    background:transparent;
    width:100%;
    padding:9px 6px;
}

td input:focus{
    background:#f7f7f5;
    border-radius:5px;
}

.checkbox{
    width:18px!important;
    height:18px;
}

.delete{
    border:0;
    background:transparent;
    color:#bbb;
    font-size:18px;
}

.delete:hover{color:#d55}

.add-row{
    border:0;
    background:white;
    color:#888;
    padding:13px;
    width:100%;
    text-align:left;
}

.add-row:hover{
    background:#fafaf8;
}

/* MODAL */
.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
    align-items:center;
    justify-content:center;
    z-index:20;
}

.modal{
    width:420px;
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.18);
}

.modal h2{
    margin-top:0;
}

.modal input{
    width:100%;
    border:1px solid #ddd;
    padding:11px;
    border-radius:7px;
    outline:0;
    margin:12px 0 20px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

/* MOBILE */
@media(max-width:700px){
    .sidebar{
        width:190px;
    }

    .content{
        margin-left:190px;
        width:calc(100% - 190px);
        padding:30px 20px;
    }

    .page-title{
        font-size:27px;
    }
.icon-option {
    width: 42px;
    height: 42px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: white;
    font-size: 22px;
    cursor: pointer;
    transition: 0.15s;
}

.icon-option:hover {
    background: #f5f5f5;
}

.icon-option.selected {
    border: 2px solid #222;
    background: #f1f1f1;
}
    /* ANA SAYFA COVER */

.cover-container {
    width: 100%;
    height: 220px;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 28px;
    background: #eeeeee;
}

.home-cover {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.cover-upload {
    position: absolute;
    right: 16px;
    bottom: 16px;
}

.cover-upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 14px;
    border-radius: 8px;
    background: rgba(255,255,255,0.92);
    color: #333;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: 0.2s;
}

.cover-upload-btn:hover {
    background: white;
    transform: translateY(-1px);
}
}
</style>

    function enableColumnResize(){

    const table = document.querySelector(".table-wrap table");

    if(!table) return;

    table.style.tableLayout = "fixed";

    const headers = table.querySelectorAll("thead th");

    headers.forEach((th, index) => {

        th.style.position = "relative";

        const savedWidth =
            localStorage.getItem("columnWidth_" + index);

        if(savedWidth){
            th.style.width = savedWidth + "px";
        }

        const handle = document.createElement("div");

        handle.style.position = "absolute";
        handle.style.right = "0";
        handle.style.top = "0";
        handle.style.width = "6px";
        handle.style.height = "100%";
        handle.style.cursor = "col-resize";
        handle.style.userSelect = "none";

        handle.addEventListener("mousedown", function(e){

            e.preventDefault();

            const startX = e.clientX;
            const startWidth = th.offsetWidth;

            function resize(e){

                const newWidth = Math.max(
                    60,
                    startWidth + (e.clientX - startX)
                );

                th.style.width = newWidth + "px";
            }

            function stopResize(){

                localStorage.setItem(
                    "columnWidth_" + index,
                    th.offsetWidth
                );

                document.removeEventListener("mousemove", resize);
                document.removeEventListener("mouseup", stopResize);
            }

            document.addEventListener("mousemove", resize);
            document.addEventListener("mouseup", stopResize);

        });

        th.appendChild(handle);

    });
}

    function deleteList(name){

    if(name === "Yuvamız" || name === "Kamp"){
        alert("Bu sayfa silinemez.");
        return;
    }

    if(!customLists.includes(name)){
        alert("Bu sayfa silinemiyor.");
        return;
    }

    if(!confirm(
        '"' + name + '" sayfası ve içindeki tüm maddeler silinecek. Devam edilsin mi?'
    )){
        return;
    }

    customLists = customLists.filter(item => item !== name);

    delete data[name];

    save();

    updateSidebar();

    showHome();
}
    
function openAddList(){

    document.getElementById("modal").style.display="flex";

    document.getElementById("listName").focus();
}

function closeModal(){

    document.getElementById("modal").style.display="none";

    document.getElementById("listName").value="";
}

function createList(){

    let name =
        document.getElementById("listName").value.trim();

    let icon =
        document.getElementById("selectedPageIcon").value || "📄";

    if(!name){
        alert("Lütfen bir sayfa adı yaz.");
        return;
    }

    if(name === "Yuvamız" || name === "Kamp"){
        alert("Bu isim kullanılamaz.");
        return;
    }

    if(customLists.includes(name)){
        alert("Bu isimde bir sayfa zaten var.");
        return;
    }

    customLists.push(name);

    if(!data[name]){
        data[name] = [];
    }

    pageIcons[name] = icon;

    save();

    updateSidebar();

    closeModal();

    showHome();
}

    function editPage(name){

    if(!customLists.includes(name)){
        return;
    }

    const currentIcon = pageIcons[name] || "📄";

    document.getElementById("listName").value = name;
    document.getElementById("selectedPageIcon").value = currentIcon;

    document
        .querySelectorAll("#iconPicker .icon-option")
        .forEach(button => {

            if(button.textContent.trim() === currentIcon){
                button.classList.add("selected");
            } else {
                button.classList.remove("selected");
            }

        });

    document.querySelector("#modal h2").textContent = "Sayfayı Düzenle";

    const createButton =
        document.querySelector("#modal .btn.primary");

    createButton.textContent = "Kaydet";

    createButton.onclick = function(){
        saveEditedPage(name);
    };

    document.getElementById("modal").style.display = "flex";
}

    function saveEditedPage(oldName){

    const newName =
        document.getElementById("listName").value.trim();

    const newIcon =
        document.getElementById("selectedPageIcon").value || "📄";

    if(!newName){
        alert("Lütfen bir sayfa adı yaz.");
        return;
    }

    if(
        newName !== oldName &&
        customLists.includes(newName)
    ){
        alert("Bu isimde bir sayfa zaten var.");
        return;
    }

    customLists = customLists.map(item =>
        item === oldName ? newName : item
    );

    if(newName !== oldName){

        if(data[oldName]){
            data[newName] = data[oldName];
            delete data[oldName];
        }

        pageIcons[newName] = newIcon;
        delete pageIcons[oldName];

    } else {

        pageIcons[newName] = newIcon;
    }

    save();
    updateSidebar();
    closeModal();
    showHome();
}
    
function updateSidebar(){

    document.getElementById("customLists").innerHTML =
        customLists.map(name=>`
            <button class="nav-item"
                onclick="openCategory('${name}')">
                📋 ${escapeHTML(name)}
            </button>
        `).join("");
}

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

updateSidebar();
showHome();

<script>
    
let authMode = "login";

function toggleAuthMode(){

    authMode = authMode === "login" ? "signup" : "login";

    const button = document.getElementById("authButton");
    const subtitle = document.getElementById("loginSubtitle");
    const switchButton = document.getElementById("authSwitch");
    const message = document.getElementById("authMessage");

async function handleAuth(){

    const email =
        document.getElementById("authEmail").value.trim();

    const password =
        document.getElementById("authPassword").value;

    const message =
        document.getElementById("authMessage");

    if(!email || !password){

        message.textContent =
            "Lütfen e-posta ve şifre alanlarını doldur.";

        return;
    }

    message.textContent = "İşlem yapılıyor...";

    if(authMode === "signup"){

        const { data, error } =
            await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

        if(error){

            message.textContent = error.message;
            return;
        }

        message.textContent =
            "Kayıt başarılı! E-posta adresine gelen doğrulama bağlantısına tıkla.";

    }else{

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if(error){

            message.textContent = error.message;
            return;
        }

        showAuthenticatedApp(data.user);
    }
}

function showAuthenticatedApp(user){

    if (!user) {
        user = currentUser;
    }

    if (!user) {
        console.error("Kullanıcı bilgisi bulunamadı.");
        return;
    }

    document.getElementById("loginScreen").style.display = "none";

    document.querySelector(".app").style.display = "flex";

    console.log("Giriş yapan kullanıcı:", user.email);

    showHome();
}
async function checkAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (session) {
        currentUser = session.user;

        await loadUserData();
        
        updateSidebar();
        
        showAuthenticatedApp(session.user);
    } else {
        currentUser = null;
        showLoginScreen();
    }
}

supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if (session) {

           currentUser = session.user;

           await loadUserData();
            
            updateSidebar();

           showAuthenticatedApp(session.user);

        } else {

            currentUser = null;

            document.querySelector(".app").style.display = "none";

            document.getElementById("loginScreen").style.display = "flex";
        }
    }
);

checkAuth();
</script>
